server:
  port: 8082
spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/notification_db
  kafka:
    consumer:
      group-id: notification-service-group
  mail:
    host: ${EMAIL_HOST}
    port: ${EMAIL_PORT}
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true